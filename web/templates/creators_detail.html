
{{ template "base" . }}

{{ define "title" }} - {{ .creatorName }}{{ end }}

{{ define "content" }}
<div class="page-intro">
  <a class="back" href="/creator.html">Creators</a>

  <h1 class="concept-label">{{ .creatorName }}</h1>

  <p>
    {{ .bookCount }} artists' book{{ if ne (printf "%s" .bookCount) "1" }}s{{ end }}
  </p>
</div>

{{ with .books }}
<div class="section">
  <h2>Artists' Books</h2>
  {{ template "book-cards" . }}
</div>
{{ end }}

{{ end }}
